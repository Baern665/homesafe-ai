name: HomeSafe beta checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STREAMLIT_LOGGER_LEVEL: error
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned application dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run offline unit, PDF, and Streamlit UI tests
        run: python -m unittest discover -s . -p 'test_*.py' -v
